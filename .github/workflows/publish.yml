name: Publish

on:
  workflow_call:
    inputs:
      tag_name:
        description: "Release tag to publish (e.g. v0.2.0)"
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image name and version
        id: vars
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository }}
          TAG_NAME: ${{ inputs.tag_name }}
        run: |
          echo "image_name=$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "version=${TAG_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4
        id: buildx

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          builder: ${{ steps.buildx.outputs.name }}
          push: true
          provenance: false
          tags: |
            ${{ steps.vars.outputs.image_name }}:${{ steps.vars.outputs.version }}
            ${{ steps.vars.outputs.image_name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: azure/setup-helm@v5

      - name: Package and push Helm chart
        env:
          OCI_REPO: oci://ghcr.io/${{ github.repository }}
          VERSION: ${{ steps.vars.outputs.version }}
          IMAGE_NAME: ${{ steps.vars.outputs.image_name }}
        run: |
          sed -i "s|SET-BY-CICD-IMAGE|$IMAGE_NAME|" ./helm/values.yaml
          sed -i "s/SET-BY-CICD-TAG/$VERSION/" ./helm/values.yaml
          sed -i "s/^version: .*/version: $VERSION/" ./helm/Chart.yaml
          helm package ./helm/ -d ./helm/.helm-charts
          helm push ./helm/.helm-charts/*.tgz "$(echo "$OCI_REPO" | tr '[:upper:]' '[:lower:]')"
