apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      containers:
        - name: {{ .Release.Name }}
          image: "{{ .Values.image.name }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - secretRef:
                name: {{ .Values.existingDbSecret }}
          env:
            - name: CRON_SCHEDULE
              value: {{ .Values.cronSchedule | quote }}
            - name: QUERY_STATEMENT_TIMEOUT
              value: {{ .Values.queryStatementTimeout | quote }}
          livenessProbe:
            httpGet:
              path: /stats/healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /stats/readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
            # The first refresh runs several full-table scans and took ~2m50s on staging,
            # so allow 7.5min of headroom before the pod is reported NotReady.
            failureThreshold: 30
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
